name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  backend:
    name: Backend — lint, tests, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resumeiq_user
          POSTGRES_PASSWORD: resumeiq_pass
          POSTGRES_DB: resumeiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resumeiq_user -d resumeiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first: avoids pulling ~3 GB of CUDA wheels that CI never uses.
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Unit + API tests with coverage (SQLite, real NLP models)
        run: python -m pytest tests/ --cov=app --cov-report=term-missing:skip-covered
      - name: Integration tests (PostgreSQL)
        env:
          TEST_POSTGRES_URL: postgresql://resumeiq_user:resumeiq_pass@localhost:5432/resumeiq_test
        run: python -m pytest tests/ -m integration -v
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql://resumeiq_user:resumeiq_pass@localhost:5432/resumeiq_test
        run: |
          python - <<'EOF'
          from sqlalchemy import create_engine, text
          with create_engine("postgresql://resumeiq_user:resumeiq_pass@localhost:5432/resumeiq_test").begin() as c:
              c.execute(text("DROP SCHEMA public CASCADE; CREATE SCHEMA public;"))
          EOF
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend — format, types, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format (prettier)
        run: npm run format:check
      - name: Type check
        # tsc -b follows the project references in tsconfig.json; plain
        # `tsc --noEmit` on the root config would check zero files.
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (API client, auth, mock toggle)
        run: npm run test:coverage
      - name: Production build
        run: npm run build

  docker:
    name: Docker — build image & smoke test (as deployed on Render)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: resumeiq-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot with PostgreSQL under Render's free-tier memory cap and hit /health
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_USER=resumeiq -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=resumeiq postgres:16-alpine
          sleep 5
          docker run -d --name api --network smoke --memory=512m -p 8000:10000 -e PORT=10000 \
            -e JWT_SECRET_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_URL=postgres://resumeiq:smoke@db:5432/resumeiq \
            resumeiq-api:ci
          # Wait for the API to come up (migrations + model preload happen before it listens).
          healthy=false
          for i in $(seq 1 60); do
            if body=$(curl -sf localhost:8000/health) && echo "$body" | grep -q '"status":"healthy"'; then
              echo "API healthy after ~$((i * 2))s: $body"
              healthy=true
              break
            fi
            sleep 2
          done
          [ "$healthy" = true ] || { echo "::error::API never became healthy"; exit 1; }

          # App logs go to STDERR (Python logging), and `docker logs` replays the
          # container's stderr on its own stderr — so merge it into the pipe.
          docker logs api 2>&1 | grep -q "event=migrations_applied" \
            || { echo "::error::migrations_applied not found in startup logs"; exit 1; }
          docker logs api 2>&1 | grep -q "event=models_preloaded" \
            || { echo "::error::models_preloaded not found in startup logs"; exit 1; }
          echo "Startup verified: migrations applied, models preloaded, /health OK under a 512 MB cap."
      - name: Container logs on failure
        if: failure()
        run: docker logs api || true
