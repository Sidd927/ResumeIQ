# Render Blueprint — one-click deploy of the API + PostgreSQL.
# Render dashboard → New → Blueprint → pick this repo. Render reads this file,
# builds backend/Dockerfile and provisions the database.
#
# Free-tier facts worth knowing:
# - The web service sleeps after ~15 min idle; the next request wakes it
#   (cold start ≈ 30–60 s while the NLP models load). The frontend shows a
#   "waking up" message and pings /health on page load to start waking it early.
# - Free PostgreSQL databases expire 30 days after creation (Render sends
#   reminders); upgrade the plan or recreate it to keep data.
services:
  - type: web
    name: resumeiq-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resumeiq-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true # random secret generated by Render, never committed
      # Your Vercel URL, e.g. https://resumeiq.vercel.app — Render prompts for
      # it when you create the Blueprint (sync: false = not stored in this file).
      - key: BACKEND_CORS_ORIGINS
        sync: false
      # Optional: also allow Vercel preview deployments of this project.
      - key: BACKEND_CORS_ORIGIN_REGEX
        value: ^https://resumeiq(-[a-z0-9-]+)?\.vercel\.app$
      - key: PRELOAD_MODELS
        value: "true"
      - key: LOG_LEVEL
        value: info

databases:
  - name: resumeiq-db
    plan: free
    databaseName: resumeiq
    user: resumeiq
    postgresMajorVersion: "16"
