[project]
name = "resumeiq-api"
version = "0.2.0"
requires-python = ">=3.11"

# Ruff = formatter (black-compatible) + linter + import sorter in one tool.
#   ruff format .        ruff check --fix .
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes: unused imports/variables, undefined names
  "I",       # isort
  "UP",      # pyupgrade: modern syntax for 3.11
  "B",       # bugbear: likely bugs
  "SIM",     # simplifications
  "T20",     # no print() in app code
]
ignore = [
  "B008",  # FastAPI's `Depends(...)` in argument defaults is the idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"tests/conftest.py" = ["E402"]  # env vars must be set before importing the app

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# backend/alembic/ (migrations) would otherwise make isort treat the library as first-party.
known-third-party = ["alembic"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover", "\\.\\.\\."]
