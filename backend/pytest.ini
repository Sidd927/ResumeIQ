[pytest]
testpaths = tests
pythonpath = .
addopts = -m "not integration"
markers =
    integration: needs a real PostgreSQL (set TEST_POSTGRES_URL); skipped by default, run with `pytest -m integration`
filterwarnings =
    # Third-party deprecation noise we can't fix locally.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:Importing 'parser.split_arg_string' is deprecated:DeprecationWarning
